<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Flask Application</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin: 12px 0;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #2ecc71;
            border-radius: 30px;
            font-weight: bold;
        }

        .tech {
            margin-top: 30px;
            font-size: 16px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 DevOps Flask App</h1>

        <p>Welcome to my DevOps demonstration application.</p>

        <div class="status">
            ● Application Running
        </div>

        <div class="tech">
            <p><strong>Technologies</strong></p>
            <p>Python + Flask</p>
            <p>Docker + Jenkins + GitHub</p>
        </div>

    </div>

</body>

</html>
